<script>
(function () {
   
  var nav = document.getElementById('nav');
  if (nav) {
    var onScroll = function () {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

   
  var hamburger = document.getElementById('nav-hamburger');
  var navLinks  = document.querySelector('.nav-links');
  if (hamburger && navLinks) {
    hamburger.addEventListener('click', function () {
      navLinks.classList.toggle('open');
    });
    navLinks.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') navLinks.classList.remove('open');
    });
  }

   
  var reveals = document.querySelectorAll('.reveal');
  if (reveals.length && 'IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    reveals.forEach(function (el) { obs.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('visible'); });
  }

   
  var nameEl = document.getElementById('hero-name');
  if (nameEl) {
    var CHARS   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&';
    var original = nameEl.textContent.trim();
    var frame    = 0;
    var speed    = 0.45;  
    var delay    = 280;   

    setTimeout(function () {
       
      nameEl.classList.add('visible');

      var raf;
      function step() {
        nameEl.textContent = original.split('').map(function (ch, i) {
           
          if (ch === '.' || ch === ' ' || ch === '-') return ch;
          if (i < Math.floor(frame)) return original[i];
          return CHARS[Math.floor(Math.random() * CHARS.length)];
        }).join('');

        frame += speed;
        if (frame <= original.length) {
          raf = requestAnimationFrame(step);
        } else {
          nameEl.textContent = original;  
        }
      }
      raf = requestAnimationFrame(step);
    }, delay);
  }

   
  var ytScroll = document.getElementById('yt-scroll');
  if (ytScroll && ytScroll.dataset.autoImport === 'true' && ytScroll.dataset.channelId) {
    var channelId = ytScroll.dataset.channelId;
    var limit = parseInt(ytScroll.dataset.limit || '8', 10);
    var rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + encodeURIComponent(channelId);
    var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

    var esc = function (str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    fetch(apiUrl)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || !Array.isArray(data.items) || !data.items.length) return;

        var items = data.items.slice(0, limit);
        var html = items.map(function (item) {
          var title = esc(item.title || 'Latest upload');
          var videoUrl = esc(item.link || '#');
          var thumb = esc(item.thumbnail || '');
          if (!thumb || videoUrl === '#') return '';

          return [
            '<article class="yt-card">',
            '  <a class="yt-thumb" href="' + videoUrl + '" target="_blank" rel="noopener noreferrer" aria-label="Watch ' + title + ' on YouTube">',
            '    <img src="' + thumb + '" alt="' + title + ' thumbnail" loading="lazy">',
            '    <span class="yt-play">▶</span>',
            '  </a>',
            '  <a class="yt-title" href="' + videoUrl + '" target="_blank" rel="noopener noreferrer">' + title + ' ↗</a>',
            '</article>'
          ].join('');
        }).join('');

        if (html.trim()) ytScroll.innerHTML = html;
      })
      .catch(function () {
      });
  }
})();
</script>
