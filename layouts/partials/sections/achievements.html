{{ if .Site.Params.achievements.enable | default false }}
<section id="achievements" class="site-section">
  <div class="wrap">

    <div class="sec-hd reveal">
      <div class="sec-num">04 — Wins</div>
      <h2 class="sec-title">{{ .Site.Params.achievements.title | default "Achievements" }}</h2>
    </div>

    <ul class="achiev-list">
      {{ range .Site.Params.achievements.items }}
      <li class="achiev-item reveal">
        <div class="achiev-left">
          <div class="achiev-title">{{ .title }}</div>
          <div class="achiev-desc">{{ .content }}</div>
        </div>
        {{ if .url }}
        <a class="achiev-url" href="{{ .url }}" target="_blank" rel="noopener noreferrer">View ↗</a>
        {{ end }}
      </li>
      {{ end }}
    </ul>

  </div>
</section>
{{ end }}
