{{ if .Site.Params.experience.enable | default false }}
<section id="experience" class="site-section">
  <div class="wrap">

    <div class="sec-hd reveal">
      <div class="sec-num">04 — Work</div>
      <h2 class="sec-title">{{ .Site.Params.experience.title | default "Experience" }}</h2>
    </div>

    <div class="exp-list">
      {{ range .Site.Params.experience.items }}
      <div class="exp-item reveal">

        <div class="exp-meta">
          <div class="exp-date">{{ .date }}</div>
          <a class="exp-co-link" href="{{ .companyUrl }}" target="_blank" rel="noopener noreferrer">
            {{ .company }} ↗
          </a>
        </div>

        <div class="exp-body">
          <div class="exp-role">{{ .job }}</div>
          <div class="exp-company">at {{ .company }}</div>
          <div class="exp-content">
            {{ .content | markdownify }}
          </div>
        </div>

      </div>
      {{ end }}
    </div>

  </div>
</section>
{{ end }}
