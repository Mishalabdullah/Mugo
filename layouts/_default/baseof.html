<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  {{- partial "head.html" . -}}
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
</head>
<body>
  {{- partial "sections/header.html" . -}}
  <main id="content">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "sections/footer/index.html" . -}}
  {{- partial "scripts.html" . -}}
</body>
</html>
