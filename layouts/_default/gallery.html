{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}

{{ define "main" }}

<div class="blog-header">
  <div class="sec-num">Visuals</div>
  <h1 class="sec-title">Gallery</h1>
</div>

<div class="gallery-wrap wrap">
  <div class="gallery-grid">
    {{ range .Site.Data.gallery.images }}
    <a href="/gallery/{{ .name }}" data-lightbox="photos" data-title="{{ .name }}" class="gallery-cell">
      <img src="/gallery/{{ .name }}" alt="{{ .name }}" loading="lazy">
    </a>
    {{ end }}
  </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
<script>
  lightbox.option({ resizeDuration: 200, wrapAround: true, albumLabel: '%1 / %2' });
</script>

{{ end }}
