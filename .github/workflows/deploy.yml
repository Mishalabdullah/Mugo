name: Build and deploy Astro to GitHub Pages

on:
  push:
    branches: [version2, feature/astro]
  pull_request:
    branches: [version2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check, build, verify, and upload the Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run check && npm run build && npm run verify

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/version2' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built site
        id: deployment
        uses: actions/deploy-pages@v5
